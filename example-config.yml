# Copy to config.yml and replace every placeholder before use.
organization_url: https://dev.azure.com/your-organization

projects:
  - name: Shared Platform Services
    repositories:
      - name: agent-infrastructure
    pipelines:
      - name: "REPLACE: agent image build"
        definition_id: 1001
        role: image-build
      - name: "REPLACE: agent deployment"
        definition_id: 1002
        role: deployment
      - name: "REPLACE: platform smoke tests"
        definition_id: 1003
        role: smoke-test

  - name: Shared Pipeline Templates
    repositories:
      - name: Examples
      - name: TestConfig
    pipelines:
      - name: "REPLACE: template PR validation"
        definition_id: 2001
        role: pr-validation
        repository: Examples
      - name: "REPLACE: template smoke tests"
        definition_id: 2002
        role: smoke-test
