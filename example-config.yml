# Copy to config.yml and replace every placeholder before use.
organization_url: https://dev.azure.com/your-organization

projects:
  - name: Shared Platform Services
    repositories:
      - name: agent-infrastructure
    pipelines:
      - name: "REPLACE: agent main CI"
        definition_id: 1000
        role: pipeline
        repository: agent-infrastructure
      - name: "REPLACE: agent image build"
        definition_id: 1001
        role: image-build
        repository: agent-infrastructure
      - name: "REPLACE: agent deployment"
        definition_id: 1002
        role: deployment
        repository: agent-infrastructure
      - name: "REPLACE: platform smoke tests"
        definition_id: 1003
        role: smoke-test
        repository: agent-infrastructure

  - name: Shared Pipeline Templates
    repositories:
      - name: Examples
      - name: TestConfig
    pipelines:
      - name: "REPLACE: Examples main CI"
        definition_id: 2000
        role: pipeline
        repository: Examples
      - name: "REPLACE: TestConfig main CI"
        definition_id: 2001
        role: pipeline
        repository: TestConfig
      - name: "REPLACE: template PR validation"
        definition_id: 2002
        role: pr-validation
        repository: Examples
      - name: "REPLACE: template smoke tests"
        definition_id: 2003
        role: smoke-test
        repository: TestConfig
