# Copy to config.yml and replace every placeholder before use.
organization_url: https://dev.azure.com/your-organization

projects:
  - name: Shared Platform Services
    repositories:
      - name: agent-infrastructure
    pipelines:
      - name: "REPLACE: agent image build"
        definition_id: 1000
        role: image-build
        repository: agent-infrastructure
      - name: "REPLACE: agent deployment"
        definition_id: 1001
        role: deployment
        repository: agent-infrastructure
      - name: "REPLACE: platform smoke tests"
        definition_id: 1002
        role: smoke-test
        repository: agent-infrastructure

  - name: Shared Pipeline Templates
    repositories:
      - name: Templates
        reusable_template_prs:
          enabled: true
          max_age_days: 14
          templates:
            - path: /templates/build.yml
              name: Build Template
            - path: /templates/deploy.yml
              name: Deploy Template
      - name: Examples
      - name: TestConfig
    pipelines:
      - name: "REPLACE: template PR validation"
        definition_id: 2000
        role: pr-validation
        repository: Examples
      - name: "REPLACE: template smoke tests"
        definition_id: 2001
        role: smoke-test
        repository: TestConfig
