<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pipeline Health Dashboard</title>
    <link rel="stylesheet" href="/dashboard.css">
  </head>
  <body>
    <header>
      <div><p>Azure DevOps</p><h1>Pipeline Health</h1></div>
      <button id="refresh" type="button">Refresh</button>
    </header>
    <nav aria-label="Dashboard views"><a href="#overview">Repo CI Status</a><a href="#reusable-template-prs">Reusable Template PRs</a><a href="#smoke-tests">Smoke Tests</a><a href="#supporting-pipelines">Supporting Pipelines</a></nav>
    <main>
      <p id="updated">Loading pipeline health...</p>
      <p id="error" class="error" hidden></p>
      <section id="overview"><h2>Repo CI Status</h2><div id="summary" class="summary"></div><div id="repositories" class="table-wrap"></div></section>
      <section id="reusable-template-prs"><h2>Reusable Template PRs</h2><div id="template-pr-list" class="rows"></div></section>
      <section id="smoke-tests"><h2>Smoke Tests</h2><div id="smoke-list" class="rows"></div></section>
      <section id="supporting-pipelines"><h2>Supporting Pipelines</h2><div id="supporting-pipeline-list" class="rows"></div></section>
    </main>
    <script src="/dashboard.js"></script>
  </body>
</html>
